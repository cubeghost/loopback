<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>loopback hydra frame</title>
  <script src="https://cdn.jsdelivr.net/npm/hydra-synth/dist/hydra-synth.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">
  <canvas id="hydra"></canvas>
  <script>
    const canvas = document.getElementById("hydra");
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const hydraArgs = {
      width: window.innerWidth,
      height: window.innerHeight,
      canvas
    };

    let hydra = new Hydra({
      ...hydraArgs,
      detectAudio: false
    });

    const AsyncFunction = Object.getPrototypeOf(async function () { }).constructor;
    const run = async (code) => {
      try {
        hydra.eval(code)
      } catch (err) {
        console.log(err);
      }
    };
    const reinitWithAudio = (detectAudio) => {
      hydra.hush();
      hydra = new Hydra({
        ...hydraArgs,
        detectAudio
      });
    }

    window.addEventListener("message", (event) => {
      if ("detectAudio" in event.data && event.data.detectAudio !== hydra.detectAudio) {
        reinitWithAudio(event.data.detectAudio);
      }
      switch (event.data.type) {
        case "hydra:start":
        case "hydra:render":
        case "hydra:init":
          run(event.data.code);
          return;
      }
    });
  </script>
</body>

</html>
