<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>loopback hydra frame</title>
  <script src="https://cdn.jsdelivr.net/npm/hydra-synth/dist/hydra-synth.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">
  <canvas id="hydra"></canvas>
  <script>
    const canvas = document.getElementById("hydra");
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const hydraArgs = {
      width: window.innerWidth,
      height: window.innerHeight,
      canvas
    };

    let source;
    let hydra = new Hydra({
      ...hydraArgs,
      detectAudio: false
    });

    const AsyncFunction = Object.getPrototypeOf(async function () { }).constructor;
    const run = async (code) => {
      source = code;
      try {
        hydra.eval(source)
      } catch (err) {
        console.log(err);
      }
    };

    window.addEventListener("message", (event) => {
      if (event.data.type === "hydra") {
        if (event.data.detectAudio !== hydra.detectAudio) {
          hydra.hush();
          hydra = new Hydra({
            ...hydraArgs,
            detectAudio: event.data.detectAudio
          });
        }

        run(event.data.code);
      }
    });
  </script>
</body>

</html>
